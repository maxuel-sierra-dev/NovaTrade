<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Monitor de Criptomonedas</title>
    <link rel="icon" href="img/logo.ico" type="image/x-icon">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Syne:wght@400;600;800&display=swap');

        * { box-sizing: border-box; }
        body { background: #0b0e14; color: #e2e8f0; font-family: 'Syne', sans-serif; margin: 0; min-height: 100vh; }

        .sidebar { background: #12151e; border-right: 1px solid #1c202e; width: 64px; position: fixed; top: 0; left: 0; height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 0 0 12px; gap: 8px; z-index: 100; }
        .logo-slot { width: 64px; height: 56px; border-bottom: 1px solid #1c202e; display: flex; align-items: center; justify-content: center; margin-bottom: 8px; cursor: pointer; position: relative; flex-shrink: 0; }
        .logo-slot img { width: 36px; height: 36px; object-fit: contain; border-radius: 8px; display: none; }
        .logo-placeholder { width: 36px; height: 36px; border: 1.5px dashed #2a2f3e; border-radius: 8px; display: flex; align-items: center; justify-content: center; color: #2a2f3e; font-size: 18px; transition: border-color 0.2s, color 0.2s; }
        .logo-slot:hover .logo-placeholder { border-color: #f5c518; color: #f5c518; }
        .logo-slot input[type="file"] { position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%; }
        .nav-btn { width: 44px; height: 44px; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; gap: 2px; color: #5a5f72; font-size: 9px; text-align: center; text-decoration: none; transition: background 0.15s, color 0.15s; font-family: 'Syne', sans-serif; }
        .nav-btn:hover { background: #1c202e; color: #fff; }
        .nav-btn.active { background: #1c202e; color: #f5c518; }
        .nav-btn span { font-size: 18px; line-height: 1; }
        .nav-divider { width: 36px; height: 1px; background: #1c202e; margin: 4px 0; }

        .main { margin-left: 64px; padding: 24px 28px; }

        .ticker-bar { background: #12151e; border-bottom: 1px solid #1c202e; padding: 8px 28px 8px calc(64px + 28px); overflow: hidden; white-space: nowrap; position: fixed; top: 0; left: 0; right: 0; z-index: 50; }
        .ticker-inner { display: inline-flex; gap: 32px; animation: ticker 30s linear infinite; }
        @keyframes ticker { 0% { transform: translateX(0); } 100% { transform: translateX(-50%); } }
        .ticker-item { font-family: 'Space Mono', monospace; font-size: 12px; color: #94a3b8; }
        .ticker-item .sym { color: #f5c518; font-weight: 700; margin-right: 6px; }
        .ticker-item .up { color: #00c15d; }
        .ticker-item .down { color: #ff4a5b; }

        .crypto-card { background: #12151e; border: 1px solid #1c202e; border-radius: 14px; padding: 18px 20px; transition: border-color 0.2s, transform 0.15s; cursor: pointer; }
        .crypto-card:hover { border-color: #2a2f3e; transform: translateY(-2px); }
        .crypto-card.alert-active { border-color: #f5c518; }
        .crypto-card.triggered { border-color: #00c15d; animation: pulse-border 1s ease 3; }
        @keyframes pulse-border { 0%,100% { border-color: #00c15d; } 50% { border-color: #00ff88; box-shadow: 0 0 16px #00c15d44; } }

        .price-mono { font-family: 'Space Mono', monospace; }
        .badge-up { background: #00c15d18; color: #00c15d; border-radius: 6px; padding: 2px 8px; font-size: 12px; font-family: 'Space Mono', monospace; }
        .badge-down { background: #ff4a5b18; color: #ff4a5b; border-radius: 6px; padding: 2px 8px; font-size: 12px; font-family: 'Space Mono', monospace; }

        .spark { height: 40px; width: 100%; }

        /* Alert modal */
        .overlay { position: fixed; inset: 0; background: #00000088; display: flex; align-items: center; justify-content: center; z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
        .overlay.show { opacity: 1; pointer-events: all; }
        .modal { background: #12151e; border: 1px solid #2a2f3e; border-radius: 16px; padding: 28px; width: 340px; }

        input[type="number"] { background: #0b0e14; border: 1px solid #2a2f3e; border-radius: 8px; color: #e2e8f0; padding: 10px 14px; width: 100%; font-family: 'Space Mono', monospace; font-size: 14px; outline: none; transition: border-color 0.2s; }
        input[type="number"]:focus { border-color: #f5c518; }

        .btn-yellow { background: #f5c518; color: #0b0e14; border: none; border-radius: 8px; padding: 10px 20px; font-family: 'Syne', sans-serif; font-weight: 800; cursor: pointer; transition: brightness 0.15s; width: 100%; }
        .btn-yellow:hover { filter: brightness(1.1); }
        .btn-ghost { background: transparent; border: 1px solid #2a2f3e; color: #94a3b8; border-radius: 8px; padding: 10px 20px; font-family: 'Syne', sans-serif; cursor: pointer; transition: background 0.15s; width: 100%; }
        .btn-ghost:hover { background: #1c202e; }

        /* Toast notification */
        .toast { position: fixed; bottom: 28px; right: 28px; background: #12151e; border: 1px solid #00c15d; border-radius: 12px; padding: 14px 18px; min-width: 260px; z-index: 300; transform: translateY(20px); opacity: 0; transition: all 0.3s; }
        .toast.show { transform: translateY(0); opacity: 1; }

        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #00c15d; animation: blink 1.5s infinite; display: inline-block; }
        @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }

        .alert-pill { background: #f5c51820; color: #f5c518; border: 1px solid #f5c51840; border-radius: 20px; padding: 2px 10px; font-size: 11px; font-family: 'Space Mono', monospace; }

        .section-label { font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #5a5f72; margin-bottom: 14px; }

        ::-webkit-scrollbar { width: 4px; } ::-webkit-scrollbar-thumb { background: #2a2f3e; border-radius: 4px; }
    </style>
</head>
<body>

<div class="ticker-bar">
    <div class="ticker-inner" id="tickerInner"></div>
</div>

<div class="main" style="padding-top: 68px;">

    <!-- HEADER -->
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 style="font-size:26px; font-weight:800; margin:0;">Monitor de Criptomonedas</h1>
            <div class="flex items-center gap-2 mt-1">
                <span class="status-dot"></span>
                <span style="font-size:12px; color:#5a5f72; font-family:'Space Mono',monospace;" id="lastUpdate">Actualizando...</span>
            </div>
        </div>
        <div class="flex gap-3">
            <button class="btn-ghost" style="width:auto; padding:8px 16px; font-size:13px;" id="btnNotif" onclick="requestNotifPermission()">🔔 Activar Notificaciones</button>
            <button class="btn-yellow" style="width:auto; padding:8px 18px; font-size:13px;" onclick="openModal(null)">+ Nueva Alerta</button>
        </div>
    </div>

    <!-- ACTIVE ALERTS BAR -->
    <div id="alertsBar" class="mb-6" style="display:none;">
        <p class="section-label">Alertas activas</p>
        <div id="alertsList" class="flex flex-wrap gap-2"></div>
    </div>

    <!-- GRID -->

<!-- ALERT MODAL -->
<div class="overlay" id="overlay" onclick="closeModal(event)">
    <div class="modal" onclick="event.stopPropagation()">
        <h2 style="font-size:18px; font-weight:800; margin:0 0 4px;">Configurar Alerta</h2>
        <p style="font-size:13px; color:#5a5f72; margin:0 0 20px;" id="modalSubtitle">Recibirás una notificación cuando se alcance el precio.</p>

        <div style="margin-bottom:14px;">
            <label style="font-size:12px; color:#94a3b8; display:block; margin-bottom:6px;">Criptomoneda</label>
            <select id="alertCoin" style="background:#0b0e14; border:1px solid #2a2f3e; border-radius:8px; color:#e2e8f0; padding:10px 14px; width:100%; font-family:'Syne',sans-serif; font-size:14px; outline:none;">
            </select>
        </div>

        <div style="margin-bottom:14px;">
            <label style="font-size:12px; color:#94a3b8; display:block; margin-bottom:6px;">Tipo de alerta</label>

                <button id="btnAbove" onclick="setAlertType('above')" style="flex:1; padding:8px; border-radius:8px; border:1px solid #f5c518; background:#f5c51818; color:#f5c518; font-family:'Syne',sans-serif; font-size:13px; font-weight:600; cursor:pointer;">▲ Por encima</button>
                <button id="btnBelow" onclick="setAlertType('below')" style="flex:1; padding:8px; border-radius:8px; border:1px solid #2a2f3e; background:transparent; color:#94a3b8; font-family:'Syne',sans-serif; font-size:13px; cursor:pointer;">▼ Por debajo</button>
            </div>
        </div>

        <div style="margin-bottom:20px;">
            <label style="font-size:12px; color:#94a3b8; display:block; margin-bottom:6px;">Precio objetivo (USD)</label>
            <input type="number" id="alertPrice" placeholder="Ej: 50000" step="0.01">
        </div>

        <div class="flex gap-2">
            <button class="btn-ghost" onclick="closeModal()">Cancelar</button>
            <button class="btn-yellow" onclick="saveAlert()">Guardar Alerta</button>
        </div>
    </div>
</div>

    { id: 'ethereum',     sym: 'ETH', name: 'Ethereum',   color: '#627eea', icon: 'Ξ' },
    { id: 'solana',       sym: 'SOL', name: 'Solana',     color: '#9945ff', icon: '◎' },
    { id: 'binancecoin',  sym: 'BNB', name: 'BNB',        color: '#f3ba2f', icon: 'B' },
    { id: 'ripple',       sym: 'XRP', name: 'XRP',        color: '#00aae4', icon: 'X' },
    { id: 'cardano',      sym: 'ADA', name: 'Cardano',    color: '#0033ad', icon: 'A' },
    { id: 'dogecoin',     sym: 'DOGE',name: 'Dogecoin',   color: '#c2a633', icon: 'Ð' },
    { id: 'polkadot',     sym: 'DOT', name: 'Polkadot',   color: '#e6007a', icon: '●' },
    { id: 'litecoin',     sym: 'LTC', name: 'Litecoin',   color: '#bfbbbb', icon: 'Ł' },
    { id: 'avalanche-2',  sym: 'AVAX',name: 'Avalanche',  color: '#e84142', icon: 'A' },
    { id: 'chainlink',    sym: 'LINK',name: 'Chainlink',  color: '#2a5ada', icon: '⬡' },
    { id: 'tron',         sym: 'TRX', name: 'TRON',       color: '#ef0027', icon: 'T' },
];

let prices = {};
let alerts = JSON.parse(localStorage.getItem('crypto_alerts') || '[]');
let alertType = 'above';
let triggered = new Set();
let historyData = {};

COINS.forEach(c => { historyData[c.id] = []; });

// ---- DataService (ApiService.js) ----
class DataService {
    static BASE_URL = "https://api.coingecko.com/api/v3";

    static async getCrypto(ids = "bitcoin,ethereum") {
        try {
            const url = `${this.BASE_URL}/simple/price?ids=${ids}&vs_currencies=usd&include_24hr_change=true`;
            const res = await fetch(url);
            if (!res.ok) throw new Error(`GET_ERROR [crypto] - ${res.status}`);
            return await res.json();
        } catch (error) {
            console.error("❌ Error en crypto:", error.message);
            throw error;
        }
    }
}

// ---- Controller ----
const controller = {
    async cargarCrypto() {
        const ids = COINS.map(c => c.id).join(',');
        const data = await DataService.getCrypto(ids);

        COINS.forEach(c => {
            if (data[c.id]) {
                const prev = prices[c.id]?.usd;
                prices[c.id] = {
                    usd: data[c.id].usd,
                    change: data[c.id].usd_24h_change || 0,
                    dir: prev ? (data[c.id].usd > prev ? 'up' : data[c.id].usd < prev ? 'down' : 'same') : 'same'
                };
                historyData[c.id].push(data[c.id].usd);
                if (historyData[c.id].length > 20) historyData[c.id].shift();
            }
        });
    }
};

async function fetchPrices() {
    try {
        await controller.cargarCrypto();
        document.getElementById('lastUpdate').textContent = '🟢 Actualizado: ' + new Date().toLocaleTimeString('es-DO');
        renderGrid();
        renderTicker();
        checkAlerts();
    } catch(e) {
        console.warn("API no disponible, usando simulación:", e.message);
        simulatePrices();
    }
}

function simulatePrices() {
    const base = { bitcoin:103000, ethereum:2400, solana:155, binancecoin:610, ripple:2.3, cardano:0.45, dogecoin:0.18, polkadot:7.2, litecoin:92, 'avalanche-2':28, chainlink:14, tron:0.12 };
    COINS.forEach(c => {
        const prev = prices[c.id]?.usd || base[c.id];
        const newPrice = prev * (1 + (Math.random() - 0.499) * 0.003);
        prices[c.id] = { usd: newPrice, change: (Math.random()-0.5)*6, dir: newPrice > prev ? 'up' : 'down' };
        historyData[c.id].push(newPrice);
        if (historyData[c.id].length > 20) historyData[c.id].shift();
    });
    document.getElementById('lastUpdate').textContent = '🟡 Simulado: ' + new Date().toLocaleTimeString('es-DO');
    renderGrid();
    renderTicker();
    checkAlerts();
}

function fmtPrice(p) {
    if (!p) return '--';
    if (p >= 1000) return '$' + p.toLocaleString('en-US', {minimumFractionDigits:2, maximumFractionDigits:2});
    if (p >= 1) return '$' + p.toFixed(4);
    return '$' + p.toFixed(6);
}

function fmtChange(c) {
    const sign = c >= 0 ? '+' : '';
    return sign + c.toFixed(2) + '%';
}

function sparkline(data, color) {
    if (data.length < 2) return '';
    const min = Math.min(...data), max = Math.max(...data);
    const range = max - min || 1;
    const w = 200, h = 40;
    const pts = data.map((v, i) => {
        const x = (i / (data.length - 1)) * w;
        const y = h - ((v - min) / range) * (h - 4) - 2;
        return `${x.toFixed(1)},${y.toFixed(1)}`;
    }).join(' ');
    return `<svg viewBox="0 0 ${w} ${h}" class="spark" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.8"/></svg>`;
}

function renderGrid() {
    const grid = document.getElementById('cryptoGrid');
    grid.innerHTML = '';
    COINS.forEach(coin => {
        const p = prices[coin.id];
        if (!p) return;
        const change = p.change;
        const isUp = change >= 0;
        const coinAlerts = alerts.filter(a => a.coinId === coin.id);
        const hasAlert = coinAlerts.length > 0;

        const card = document.createElement('div');
        card.className = 'crypto-card' + (hasAlert ? ' alert-active' : '');
        card.id = 'card-' + coin.id;
        card.onclick = () => openModal(coin.id);

        card.innerHTML = `
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center gap-3">
                    <div style="width:38px;height:38px;border-radius:50%;background:${coin.color}22;border:1px solid ${coin.color}44;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:800;color:${coin.color};">${coin.icon}</div>
                    <div>
                        <div style="font-weight:700;font-size:15px;">${coin.name}</div>
                        <div style="font-size:11px;color:#5a5f72;font-family:'Space Mono',monospace;">${coin.sym}</div>
                    </div>
                </div>
                ${hasAlert ? `<span class="alert-pill">🔔 ${coinAlerts.length}</span>` : '<span style="font-size:11px;color:#2a2f3e;">+ alerta</span>'}
            </div>
            <div class="flex items-end justify-between mb-2">
                <div class="price-mono" style="font-size:18px;font-weight:700;transition:color 0.3s;color:${p.dir==='up'?'#00c15d':p.dir==='down'?'#ff4a5b':'#e2e8f0'}">${fmtPrice(p.usd)}</div>
                <span class="${isUp ? 'badge-up' : 'badge-down'}">${fmtChange(change)}</span>
            </div>
            <div>${sparkline(historyData[coin.id], isUp ? '#00c15d' : '#ff4a5b')}</div>
        `;
        grid.appendChild(card);
    });
}

function renderTicker() {
    const inner = document.getElementById('tickerInner');
    const items = [...COINS, ...COINS].map(c => {
        const p = prices[c.id];
        if (!p) return '';
        const isUp = p.change >= 0;
        return `<span class="ticker-item"><span class="sym">${c.sym}</span><span>${fmtPrice(p.usd)}</span> <span class="${isUp?'up':'down'}">${fmtChange(p.change)}</span></span>`;
    }).join('');
    inner.innerHTML = items;
}

// ---- ALERTS ----
function renderAlertsBar() {
    const bar = document.getElementById('alertsBar');
    const list = document.getElementById('alertsList');
    if (alerts.length === 0) { bar.style.display = 'none'; return; }
    bar.style.display = 'block';
    list.innerHTML = alerts.map((a, i) => {
        const coin = COINS.find(c => c.id === a.coinId);
        return `<div class="alert-pill flex items-center gap-2" style="padding:6px 12px;">
            <span>${coin?.sym || a.coinId}</span>
            <span style="color:#94a3b8;">${a.type === 'above' ? '▲' : '▼'} ${fmtPrice(a.price)}</span>
            <span onclick="removeAlert(${i})" style="cursor:pointer;color:#ff4a5b;margin-left:4px;">✕</span>
        </div>`;
    }).join('');
}

function checkAlerts() {
    alerts.forEach((a, i) => {
        const p = prices[a.coinId]?.usd;
        if (!p || triggered.has(i)) return;
        const coin = COINS.find(c => c.id === a.coinId);
        const hit = (a.type === 'above' && p >= a.price) || (a.type === 'below' && p <= a.price);
        if (hit) {
            triggered.add(i);
            const card = document.getElementById('card-' + a.coinId);
            if (card) { card.classList.add('triggered'); setTimeout(() => card.classList.remove('triggered'), 3000); }
            showToast(`🔔 ${coin?.name} ${a.type === 'above' ? 'superó' : 'bajó de'} ${fmtPrice(a.price)}`, `Precio actual: ${fmtPrice(p)}`);
            sendBrowserNotif(coin?.name || a.coinId, a.type === 'above' ? 'superó' : 'bajó de', a.price, p);
        }
    });
}

function removeAlert(i) {
    triggered.delete(i);
    alerts.splice(i, 1);
    localStorage.setItem('crypto_alerts', JSON.stringify(alerts));
    renderAlertsBar();
    renderGrid();
}

// ---- MODAL ----
let modalCoin = null;
function openModal(coinId) {
    modalCoin = coinId;
    const select = document.getElementById('alertCoin');
    select.innerHTML = COINS.map(c => `<option value="${c.id}" ${c.id === coinId ? 'selected' : ''}>${c.name} (${c.sym})</option>`).join('');
    if (coinId && prices[coinId]) {
        document.getElementById('alertPrice').value = prices[coinId].usd.toFixed(2);
    }
    setAlertType('above');
    document.getElementById('overlay').classList.add('show');
}
function closeModal(e) {
    if (!e || e.target === document.getElementById('overlay')) {
        document.getElementById('overlay').classList.remove('show');
    }
}
function setAlertType(type) {
    alertType = type;
    document.getElementById('btnAbove').style.borderColor = type === 'above' ? '#f5c518' : '#2a2f3e';
    document.getElementById('btnAbove').style.background = type === 'above' ? '#f5c51818' : 'transparent';
    document.getElementById('btnAbove').style.color = type === 'above' ? '#f5c518' : '#94a3b8';
    document.getElementById('btnBelow').style.borderColor = type === 'below' ? '#f5c518' : '#2a2f3e';
    document.getElementById('btnBelow').style.background = type === 'below' ? '#f5c51818' : 'transparent';
    document.getElementById('btnBelow').style.color = type === 'below' ? '#f5c518' : '#94a3b8';
}
function saveAlert() {
    const coinId = document.getElementById('alertCoin').value;
    const price = parseFloat(document.getElementById('alertPrice').value);
    if (!coinId || isNaN(price) || price <= 0) { showToast('⚠️ Datos inválidos', 'Por favor completa todos los campos.'); return; }
    alerts.push({ coinId, price, type: alertType });
    localStorage.setItem('crypto_alerts', JSON.stringify(alerts));
    closeModal();
    renderAlertsBar();
    renderGrid();
    showToast('✅ Alerta guardada', `${COINS.find(c=>c.id===coinId)?.name} ${alertType === 'above' ? '▲' : '▼'} ${fmtPrice(price)}`);
}

// ---- NOTIFICATIONS ----
function requestNotifPermission() {
    if (!('Notification' in window)) { showToast('⚠️ No soportado', 'Tu navegador no soporta notificaciones.'); return; }
    Notification.requestPermission().then(p => {
        if (p === 'granted') {
            document.getElementById('btnNotif').textContent = '✅ Notificaciones activas';
            showToast('✅ Listo', 'Recibirás notificaciones de tus alertas.');
        } else {
            showToast('⚠️ Permiso denegado', 'Activa las notificaciones en tu navegador.');
        }
    });
}
function sendBrowserNotif(coin, action, target, current) {
    if (Notification.permission === 'granted') {
        new Notification(`🔔 Alerta: ${coin}`, {
            body: `El precio ${action} $${target.toLocaleString()}. Precio actual: $${current.toLocaleString()}`,
            icon: 'https://cryptologos.cc/logos/bitcoin-btc-logo.png'
        });
    }
}

// ---- TOAST ----
let toastTimer;
function showToast(title, body) {
    clearTimeout(toastTimer);
    document.getElementById('toastTitle').textContent = title;
    document.getElementById('toastBody').textContent = body;
    const t = document.getElementById('toast');
    t.classList.add('show');
    toastTimer = setTimeout(() => t.classList.remove('show'), 4000);
}

// ---- LOGO ----
function loadLogo(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = ev => {
        const img = document.getElementById('logoImg');
        img.src = ev.target.result;
        img.style.display = 'block';
        document.getElementById('logoPlaceholder').style.display = 'none';
    };
    reader.readAsDataURL(file);
}

// ---- INIT ----
if (Notification.permission === 'granted') {
    document.getElementById('btnNotif').textContent = '✅ Notificaciones activas';
}

renderAlertsBar();
fetchPrices();
setInterval(fetchPrices, 30000);
</script>
</body>
