<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial - Crypto Country</title>
    <link rel="icon" href="img/logo.ico">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body,html{margin:0;background:#0b0e14;color:white;font-family:system-ui,sans-serif;min-height:100vh;}
        .sidebar{background:#12151e;border-right:1px solid #1c202e;width:64px;position:fixed;top:0;left:0;height:100vh;display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:8px;z-index:100;}
        .nav-btn{width:44px;height:44px;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;gap:2px;color:#5a5f72;font-size:9px;text-align:center;text-decoration:none;transition:background .15s,color .15s;}
        .nav-btn:hover{background:#1c202e;color:#fff;} .nav-btn.active{background:#1c202e;color:#f5c518;}
        .nav-btn span{font-size:18px;line-height:1;} .nav-divider{width:36px;height:1px;background:#1c202e;margin:4px 0;}
        .main{margin-left:64px;padding:24px 28px;}
        .card{background:#12151e;border:1px solid #1c202e;border-radius:14px;}
        .stat-card{background:#12151e;border:1px solid #1c202e;border-radius:12px;padding:16px 20px;}
        .badge-win{background:#00c15d18;color:#00c15d;border-radius:6px;padding:3px 10px;font-size:12px;font-weight:700;}
        .badge-loss{background:#ff4a5b18;color:#ff4a5b;border-radius:6px;padding:3px 10px;font-size:12px;font-weight:700;}
        .filter-btn{background:#0b0e14;border:1px solid #2a2f3e;border-radius:8px;color:#94a3b8;padding:6px 14px;font-size:12px;cursor:pointer;transition:all .15s;}
        .filter-btn:hover,.filter-btn.active{background:#f5c51818;border-color:#f5c518;color:#f5c518;}
        .trade-row{border-bottom:1px solid #1c202e;transition:background .15s;} .trade-row:hover{background:#1c202e44;} .trade-row:last-child{border-bottom:none;}
        select{background:#0b0e14;border:1px solid #2a2f3e;border-radius:8px;color:#e2e8f0;padding:6px 10px;font-size:12px;outline:none;}
    </style>
</head>
<body>
<nav class="sidebar">
    <img src="img/logo.png" style="width:32px;height:32px;border-radius:6px;margin-bottom:4px;" onerror="this.style.display='none'">
    <a href="index.html" class="nav-btn"><span>📈</span><p>Gráfico</p></a>
    <a href="Precios-Cryptos.html" class="nav-btn"><span>₿</span><p>Cripto</p></a>
    <div class="nav-divider"></div>
    <a href="Historial.html" class="nav-btn active"><span>📋</span><p>Historial</p></a>
    <a href="Cuentas.html" class="nav-btn"><span>👤</span><p>Cuenta</p></a>
    <a href="Config.html" class="nav-btn"><span>⚙️</span><p>Config</p></a>
</nav>

<div class="main">
    <div class="flex items-center justify-between mb-6">
        <div>
            <h1 style="font-size:24px;font-weight:800;margin:0;">Historial de Trades</h1>
            <p style="color:#5a5f72;font-size:13px;margin:4px 0 0;">Todas tus operaciones registradas</p>
        </div>
        <div class="flex gap-2">
            <button class="filter-btn" onclick="exportCSV()">⬇️ Exportar CSV</button>
            <button class="filter-btn" onclick="clearHistory()" style="border-color:#ff4a5b44;color:#ff4a5b;">🗑 Limpiar</button>
        </div>
    </div>

    <div class="grid gap-3 mb-6" style="grid-template-columns:repeat(4,1fr);">
        <div class="stat-card"><p style="color:#5a5f72;font-size:11px;margin:0 0 4px;text-transform:uppercase;letter-spacing:.08em;">Total Trades</p><p style="font-size:22px;font-weight:800;margin:0;" id="statTotal">0</p></div>
        <div class="stat-card"><p style="color:#5a5f72;font-size:11px;margin:0 0 4px;text-transform:uppercase;letter-spacing:.08em;">Ganadas</p><p style="font-size:22px;font-weight:800;margin:0;color:#00c15d;" id="statWins">0</p></div>
        <div class="stat-card"><p style="color:#5a5f72;font-size:11px;margin:0 0 4px;text-transform:uppercase;letter-spacing:.08em;">Win Rate</p><p style="font-size:22px;font-weight:800;margin:0;color:#f5c518;" id="statWinRate">0%</p></div>
        <div class="stat-card"><p style="color:#5a5f72;font-size:11px;margin:0 0 4px;text-transform:uppercase;letter-spacing:.08em;">P&amp;L Total</p><p style="font-size:22px;font-weight:800;margin:0;" id="statPnl">$0.00</p></div>
    </div>

    <div class="flex gap-2 mb-4 flex-wrap items-center">
        <button class="filter-btn active" onclick="setFilter('all',this)">Todos</button>
        <button class="filter-btn" onclick="setFilter('win',this)">✅ Ganadas</button>
        <button class="filter-btn" onclick="setFilter('loss',this)">❌ Perdidas</button>
        <button class="filter-btn" onclick="setFilter('UP',this)">▲ SUBIR</button>
        <button class="filter-btn" onclick="setFilter('DOWN',this)">▼ BAJAR</button>
        <div class="flex-1"></div>
        <select id="sortSelect" onchange="renderTable()">
            <option value="newest">Más recientes</option>
            <option value="oldest">Más antiguas</option>
            <option value="biggest">Mayor inversión</option>
            <option value="pnl">Mayor P&amp;L</option>
        </select>
    </div>

    <div class="card" style="overflow:hidden;">
        <table style="width:100%;border-collapse:collapse;">
            <thead>
                <tr style="border-bottom:1px solid #1c202e;">
                    <th style="padding:12px 16px;text-align:left;font-size:11px;color:#5a5f72;font-weight:600;text-transform:uppercase;letter-spacing:.08em;">Fecha</th>
                    <th style="padding:12px 16px;text-align:left;font-size:11px;color:#5a5f72;font-weight:600;text-transform:uppercase;letter-spacing:.08em;">Activo</th>
                    <th style="padding:12px 16px;text-align:left;font-size:11px;color:#5a5f72;font-weight:600;text-transform:uppercase;letter-spacing:.08em;">Dirección</th>
                    <th style="padding:12px 16px;text-align:right;font-size:11px;color:#5a5f72;font-weight:600;text-transform:uppercase;letter-spacing:.08em;">Inversión</th>
                    <th style="padding:12px 16px;text-align:right;font-size:11px;color:#5a5f72;font-weight:600;text-transform:uppercase;letter-spacing:.08em;">P&amp;L</th>
                    <th style="padding:12px 16px;text-align:center;font-size:11px;color:#5a5f72;font-weight:600;text-transform:uppercase;letter-spacing:.08em;">Resultado</th>
                </tr>
            </thead>
            <tbody id="tradeTable"></tbody>
        </table>
        <div id="emptyState" style="display:none;padding:60px;text-align:center;color:#2a2f3e;">
            <div style="font-size:40px;margin-bottom:12px;">📋</div>
            <p style="margin:0;font-size:14px;">No hay trades aún.</p>
            <a href="index.html" style="color:#f5c518;font-size:13px;margin-top:8px;display:inline-block;">Ir al simulador →</a>
        </div>
    </div>
</div>

<script>
let allTrades=[], currentFilter='all';
function loadTrades(){
    const saved=localStorage.getItem('tradeHistory');
    if(saved){allTrades=JSON.parse(saved);}
    else{
        const assets=['EUR / USD (OTC)','BTC / USD','ETH / USD','SOL / USD','GBP / USD'];
        const now=Date.now();
        allTrades=Array.from({length:12},(_,i)=>{
            const dir=Math.random()>.5?'UP':'DOWN',inv=[10,50,100,200,500][Math.floor(Math.random()*5)];
            const entry=1000+Math.random()*50000,close=entry*(1+(Math.random()-.5)*.05);
            const gano=dir==='UP'?close>entry:close<entry;
            return{date:new Date(now-i*3600000*(1+Math.random()*5)).toISOString(),asset:assets[Math.floor(Math.random()*assets.length)],dir,inv,entry,close,gano};
        });
        localStorage.setItem('tradeHistory',JSON.stringify(allTrades));
    }
    updateStats();renderTable();
}
function updateStats(){
    const wins=allTrades.filter(t=>t.gano).length;
    const pnl=allTrades.reduce((a,t)=>a+(t.gano?t.inv*.92:-t.inv),0);
    document.getElementById('statTotal').textContent=allTrades.length;
    document.getElementById('statWins').textContent=wins;
    document.getElementById('statWinRate').textContent=allTrades.length?Math.round(wins/allTrades.length*100)+'%':'0%';
    const el=document.getElementById('statPnl');
    el.textContent=(pnl>=0?'+':'')+'$'+Math.abs(pnl).toFixed(2);
    el.style.color=pnl>=0?'#00c15d':'#ff4a5b';
}
function setFilter(f,btn){currentFilter=f;document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));btn.classList.add('active');renderTable();}
function renderTable(){
    let trades=[...allTrades];
    if(currentFilter==='win') trades=trades.filter(t=>t.gano);
    else if(currentFilter==='loss') trades=trades.filter(t=>!t.gano);
    else if(currentFilter==='UP'||currentFilter==='DOWN') trades=trades.filter(t=>t.dir===currentFilter);
    const sort=document.getElementById('sortSelect').value;
    if(sort==='newest') trades.sort((a,b)=>new Date(b.date)-new Date(a.date));
    else if(sort==='oldest') trades.sort((a,b)=>new Date(a.date)-new Date(b.date));
    else if(sort==='biggest') trades.sort((a,b)=>b.inv-a.inv);
    else trades.sort((a,b)=>(b.gano?b.inv*.92:-b.inv)-(a.gano?a.inv*.92:-a.inv));
    const tbody=document.getElementById('tradeTable'),empty=document.getElementById('emptyState');
    if(!trades.length){tbody.innerHTML='';empty.style.display='block';return;}
    empty.style.display='none';
    tbody.innerHTML=trades.map(t=>{
        const pnl=t.gano?t.inv*.92:-t.inv;
        const d=new Date(t.date);
        const fmt=d.toLocaleDateString('es-DO',{day:'2-digit',month:'short'})+' '+d.toLocaleTimeString('es-DO',{hour:'2-digit',minute:'2-digit'});
        return`<tr class="trade-row">
            <td style="padding:12px 16px;font-size:12px;color:#94a3b8;font-family:monospace;">${fmt}</td>
            <td style="padding:12px 16px;font-size:13px;font-weight:600;">${t.asset}</td>
            <td style="padding:12px 16px;"><span style="color:${t.dir==='UP'?'#00c15d':'#ff4a5b'};font-weight:700;">${t.dir==='UP'?'▲ SUBIR':'▼ BAJAR'}</span></td>
            <td style="padding:12px 16px;text-align:right;font-family:monospace;">$${t.inv.toFixed(2)}</td>
            <td style="padding:12px 16px;text-align:right;font-family:monospace;font-weight:700;color:${pnl>=0?'#00c15d':'#ff4a5b'};">${pnl>=0?'+':''}$${Math.abs(pnl).toFixed(2)}</td>
            <td style="padding:12px 16px;text-align:center;"><span class="${t.gano?'badge-win':'badge-loss'}">${t.gano?'✅ WIN':'❌ LOSS'}</span></td>
        </tr>`;
    }).join('');
}
function exportCSV(){
    const h='Fecha,Activo,Dirección,Inversión,PnL,Resultado\n';
    const r=allTrades.map(t=>`${t.date},${t.asset},${t.dir},$${t.inv},$${(t.gano?t.inv*.92:-t.inv).toFixed(2)},${t.gano?'WIN':'LOSS'}`).join('\n');
    const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([h+r],{type:'text/csv'}));a.download='historial.csv';a.click();
}
function clearHistory(){
    if(!confirm('¿Borrar todo el historial?'))return;
    allTrades=[];localStorage.removeItem('tradeHistory');updateStats();renderTable();
}
loadTrades();
</script>
</body>
</html>
